  // ========== 推荐算法：基于「上一周期」真实数据 ==========
  function suggestGoalsFor(type) {
    const negMoods = ['疲惫', '焦虑', '难过', '愤怒'];
    const posMoods = ['开心', '充实', '期待', '感恩', '平静'];
    // 获取上一周期的范围 key + 记录
    let recs = [];
    let rangeLabel = '';
    let scopeHint = type === 'week' ? '本周' : '本月';
    let periodDays = type === 'week' ? 7 : 30;
    const all = loadRecords();

    if (type === 'week') {
      const val = document.getElementById('weekPicker').value;
      if (val) {
        let [y, w] = val.split('-W').map(v=>parseInt(v,10));
        // 上周：w=1 时到去年最后一周
        w--;
        if (w < 1) { y--; w = getLastWeekOfYear(y); }
        const start = getMondayOfWeek(y, w);
        const end = new Date(start); end.setDate(end.getDate()+6);
        for (let d=new Date(start); d<=end; d.setDate(d.getDate()+1)) {
          const k = toStr(d);
          if (all[k]) recs.push(all[k]);
        }
        rangeLabel = `${y} 年第 ${w} 周`;
      }
    } else if (type === 'month') {
      const val = document.getElementById('monthPicker').value;
      if (val) {
        let [y, m] = val.split('-').map(Number);
        m--; if (m < 0) { m = 11; y--; }
        const start = new Date(y, m, 1);
        const end = new Date(y, m+1, 0); // last day
        periodDays = end.getDate();
        for (let d=new Date(start); d<=end; d.setDate(d.getDate()+1)) {
          const k = toStr(d);
          if (all[k]) recs.push(all[k]);
        }
        rangeLabel = `${y} 年 ${m+1} 月`;
      }
    }

    // === 基础指标（和 generateSummary 同源逻辑）===
    const havePrev = recs.length > 0;
    const totalSleepMin = recs.reduce((s, r) => {
      const c = calcSleepHours(r.fellAsleep, r.wakeUp);
      return c ? s + c.totalMins : s;
    }, 0);
    const avgSleepMin = recs.length ? Math.round(totalSleepMin / recs.length) : 0;
    const sleepWithData = recs.filter(r => calcSleepHours(r.fellAsleep, r.wakeUp)).length;
    const sleepDays6Plus = recs.filter(r => {
      const c = calcSleepHours(r.fellAsleep, r.wakeUp);
      return c && c.totalMins >= 360;
    }).length;

    // 任务
    let totalTasks = 0, doneTasks = 0;
    let fullDays = 0;
    const undoneTexts = [];
    recs.forEach(r => {
      const ts = (r.tasks||[]).map(t => typeof t==='string'?{text:t,done:false}:t).filter(t=>t.text);
      if (ts.length && ts.every(t=>t.done)) fullDays++;
      ts.forEach(t => {
        totalTasks++;
        if (t.done) doneTasks++;
        else undoneTexts.push(t.text);
      });
    });
    const taskRate = totalTasks ? Math.round(doneTasks/totalTasks*100) : 0;
    const avgTaskPerDay = recs.length ? Math.round(doneTasks / recs.length) : 0;

    // 心情
    const moodEntries = [];
    recs.forEach(r => {
      const moods = Array.isArray(r.moods) && r.moods.length ? r.moods : (r.mood ? [{time:'20:00', mood:r.mood}] : []);
      moods.forEach(m => moodEntries.push(m));
    });
    const negCount = moodEntries.filter(e => negMoods.includes(e.mood)).length;
    const posCount = moodEntries.filter(e => posMoods.includes(e.mood)).length;
    const negPct = moodEntries.length ? Math.round(negCount/moodEntries.length*100) : 0;

    // 体重
    const weightRecs = recs.filter(r => r.weight != null);
    const wDelta = (weightRecs.length >= 2) ? (weightRecs[weightRecs.length-1].weight - weightRecs[0].weight) : null;

    // === 候选池（每条带 rank：分数高先选） ===
    const pool = [];
    // 睡眠相关
    if (havePrev) {
      if (avgSleepMin < 390 || (sleepWithData > 0 && sleepDays6Plus < sleepWithData * 0.5)) {
        const target = Math.max(5, Math.min(7, (type==='week'? 5 : Math.round(periodDays*0.7))));
        const h = 7;
        pool.push({ s: 100, text: `${scopeHint} ${target} 天睡够 ${h} 小时（上周期平均 ${avgSleepMin?Math.floor(avgSleepMin/60)+'h'+(avgSleepMin%60)+'m':'数据不足'}，先保底线）` });
      } else {
        pool.push({ s: 20, text: `${scopeHint} 维持睡眠节奏：每天 0 点前关灯（上周期睡得不错，保持住）` });
      }
    } else {
      pool.push({ s: 95, text: `${scopeHint} ${type==='week'?5:20} 天完成记录（先攒第一波数据）` });
    }

    // 任务相关
    if (havePrev) {
      if (taskRate < 55) {
        const target = type === 'week' ? '每天至少完成 2 件' : '完成率冲 70%';
        pool.push({ s: 95 - Math.min(30, taskRate), text: `${scopeHint} ${target}（上周期完成率仅 ${taskRate}% · 建议第 3 件事换成 5 分钟能做完的小事）` });
      } else if (fullDays === 0 && totalTasks >= 3) {
        pool.push({ s: 85, text: `${scopeHint} 先出现 ${type==='week'?1:3} 个「三件事全做完」的全勤日（拉满正反馈）` });
      } else if (taskRate >= 90) {
        pool.push({ s: 25, text: `${scopeHint} 保持节奏 + 挑战一件上周期未完成的长期大事（${undoneTexts[0] ? '：'+undoneTexts[0].slice(0,20) : ''}）` });
      } else {
        pool.push({ s: 55, text: `${scopeHint} 任务完成率保 ${Math.max(70, taskRate)}%（上周期 ${taskRate}%，小幅加压）` });
      }
    } else {
      pool.push({ s: 90, text: `${scopeHint} 每天写满 3 件要事 · 完成率冲 60%（开始阶段先建立习惯）` });
    }

    // 心情相关
    if (havePrev && moodEntries.length) {
      if (negPct >= 50) {
        pool.push({ s: 90, text: `${scopeHint} 每天加 1 条「感恩/小确幸」心情记录（上周期负面心情占 ${negPct}%，拉正心态基线）` });
      } else if (posCount * 1.2 >= negCount) {
        pool.push({ s: 30, text: `${scopeHint} 心情波动大的那天，多写 1 条备注记录原因（看清情绪触发点）` });
      } else {
        pool.push({ s: 40, text: `${scopeHint} 每天至少记录 1 次心情（养成情绪觉察的习惯）` });
      }
    } else {
      pool.push({ s: 80, text: `${scopeHint} 每天至少 2 次心情打卡（上午 + 晚上），积累情绪样本` });
    }

    // 体重相关
    if (wDelta != null) {
      if (parseFloat(wDelta) >= 1.5) {
        pool.push({ s: 80, text: `${scopeHint} 把「15 分钟散步 / 拉伸」固定到要做的 3 件事里（上周期体重 +${wDelta.toFixed(1)}kg）` });
      } else if (parseFloat(wDelta) <= -1.5) {
        pool.push({ s: 35, text: `${scopeHint} 体重保持在 [${weightRecs[0].weight - 1}, ${weightRecs[weightRecs.length-1].weight + 1}] kg 区间（巩固已有成果）` });
      }
    } else if (weightRecs.length >= 1) {
      pool.push({ s: 50, text: `${scopeHint} 每天坚持称体重（只有数据连续时才看得出身体规律）` });
    }

    // 通用弹性备选 5 条（自我关怀类）
    const fallbacks = [
      { s: 15, text: `${scopeHint} 约 1 位朋友见面 / 视频聊天 30 分钟（保持社交链接）` },
      { s: 15, text: `${scopeHint} 选 1 天完全放空半天，不安排硬性要事（充电比硬冲更重要）` },
      { s: 15, text: `${scopeHint} 至少尝试 1 次新的餐厅 / 新的路线 / 新菜谱（保持生活新鲜感）` },
      { s: 15, text: `${scopeHint} 有 1 天晚上不碰工作消息 · 睡前只读纸质书（信息断食）` },
      { s: 15, text: `${scopeHint} 至少 1 次 30 分钟以上户外散步（走够 4000 步）` },
    ];
    fallbacks.forEach(f => pool.push(f));

    // 没历史数据时，给一套合理起点
    if (!havePrev) {
      pool.push({ s: 99, text: `${scopeHint} 完成全部 ${periodDays} 天的记录打卡（先建立习惯比什么都重要）` });
    }

    // === 精选 3 条：
    // 1. 高分刚性（睡眠/记录/任务优先）
    // 2. 次高分刚性（任务或心情）
    // 3. 一定要从「弹性自我关怀」里挑 1 条，保证不压抑
    const sorted = [...pool].sort((a,b) => b.s - a.s);
    const rigid = sorted.filter(p => !fallbacks.includes(p));
    const soft  = sorted.filter(p => fallbacks.includes(p));

    const result = [];
    // 刚性1
    result.push(rigid.shift() ? rigid.shift() : (()=>{
      const p = sorted.shift(); soft.push(p); return p;
    })() || sorted.shift());
    // 修正：上面写复杂了，简单点重新推
    result.length = 0;
    if (sorted[0]) result.push(sorted[0]);
    // 刚性2（从刚性池剔除第1之后再选1）
    const second = sorted.slice(1).find(p => !fallbacks.includes(p)) || sorted[1] || fallbacks[0];
    if (second && !result.includes(second)) result.push(second);
    // 弹性3（来自 soft fallback 池的 Top）
    const third = soft[0] || fallbacks[0];
    if (!result.includes(third)) result.push(third);
    else result.push(soft[1] || fallbacks[1]);

    // 兜底：不足 3 条补齐
    if (result.length < 3) {
      for (const p of [...rigid, ...fallbacks]) {
        if (result.includes(p)) continue;
        result.push(p);
        if (result.length >= 3) break;
      }
    }
    // 再兜底：还是空给通用 3 条
    if (!result[0]) result[0] = `${scopeHint} 至少 ${type==='week'?5:20} 天完成记录（先攒第一波数据）`;
    if (!result[1]) result[1] = `${scopeHint} 每天至少完成 2 件要事 · 冲 60% 完成率`;
    if (!result[2]) result[2] = `${scopeHint} 至少 1 次 30 分钟以上户外散步（走够 4000 步）`;

    return [
      typeof result[0] === 'string' ? result[0] : result[0].text,
      typeof result[1] === 'string' ? result[1] : result[1].text,
      typeof result[2] === 'string' ? result[2] : result[2].text
    ];
  }
  // 计算某一年的总周数（52 or 53）
  function getLastWeekOfYear(year) {
    // ISO week rule：12月28日所在周就是最后一周
    const dec28 = new Date(year, 11, 28);
    const jan1 = new Date(year, 0, 1);
    const onejan = new Date(jan1.getFullYear(), 0, 1);
    const weekNum = Math.ceil((((dec28 - onejan) / 86400000) + onejan.getDay() + 1) / 7);
    return Math.min(53, weekNum || 52);
  }

  function getDateRange() {
    const type = document.getElementById('summaryType').value;
    if (type === 'week') {
      const [y, w] = document.getElementById('weekPicker').value.split('-W').map(v => parseInt(v, 10));
      const start = getMondayOfWeek(y, w);
      const end = new Date(start);
      end.setDate(end.getDate() + 6);
      return { start, end, type, label: `${y}年 第${w}周` };
    } else {
      const [y, m] = document.getElementById('monthPicker').value.split('-').map(Number);
      const start = new Date(y, m-1, 1);
      const end = new Date(y, m, 0);
      return { start, end, type, label: `${y}年${m}月` };
    }
  }
  function getMondayOfWeek(y, w) {
    const simple = new Date(y, 0, 1 + (w-1)*7);
    const dow = simple.getDay();
    const ISOweekStart = simple;
    if (dow <= 4) ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
    else ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
    return ISOweekStart;
  }
  function toStr(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function generateSummary() {
    const range = getDateRange();
    const all = loadRecords();
    const dates = [];
    for (let d = new Date(range.start); d <= range.end; d.setDate(d.getDate()+1)) {
      dates.push(toStr(d));
    }
    const inRange = dates.map(d => ({ date: d, rec: all[d] || null }));
    const recs = inRange.filter(x => x.rec).map(x => x.rec);

    const html = [];

    // Range banner
    html.push(`<div class="section-block" style="background:linear-gradient(135deg,#2d1b4e,#5d4e6d);color:#fff;">
      <h3 style="color:#fff;border-color:rgba(255,255,255,0.15);">📊 ${range.label} · 总结概览</h3>
      <div style="opacity:0.9;font-size:0.95rem;line-height:1.9;">
        期间：${toStr(range.start)} → ${toStr(range.end)} &nbsp;·&nbsp; 共 ${dates.length} 天 &nbsp;·&nbsp; 已记录 ${recs.length} 天
        ${recs.length < dates.length ? `&nbsp;<span style="color:#ffb88c;">(缺 ${dates.length - recs.length} 天)</span>` : '<span style="color:#a8d8ea;">(全勤!)</span>'}
      </div>
    </div>`);

    // ============ 🎯 本期 3 条目标 ============
    (function() {
      let goals = ['','',''];
      if (range.type === 'week') {
        goals = loadWeekGoals()[document.getElementById('weekPicker').value] || goals;
      } else if (range.type === 'month') {
        goals = loadMonthGoals()[document.getElementById('monthPicker').value] || goals;
      }
      const goalsExist = goals.some(g => (g||'').trim().length);
      // 目标达成情况自动评估
      const goalChecks = goals.filter(g=>g&&g.trim()).map(g => {
        const text = g.trim();
        // 提取数字：天数、次数、小时等
        const dayMatch = text.match(/(\d+)\s*[天日]/);
        const hourMatch = text.match(/(\d+)\s*[小时h小时]/i);
        const pctMatch = text.match(/(\d+)\s*%/);
        const timeMatch = text.match(/(\d+)\s*次/);
        // 判定睡眠类目标
        if (text.includes('睡') && hourMatch) {
          const target = parseInt(hourMatch[1]);
          const goodDays = recs.filter(r => {
            const c = calcSleepHours(r.fellAsleep, r.wakeUp);
            return c && c.hours >= target;
          }).length;
          return { ok: goodDays >= (dayMatch?parseInt(dayMatch[1]):recs.length), text: `${goodDays}/${dayMatch?dayMatch[1]:'全部'}天达标` };
        }
        // 判定完成率类目标
        if (text.includes('完成率') || text.includes('完成') && pctMatch) {
          const target = parseInt(pctMatch[1]);
          return { ok: taskRate >= target, text: `实际${taskRate}%` };
        }
        // 判定天数类目标
        if (dayMatch && (text.includes('记录') || text.includes('记') || text.includes('天'))) {
          const target = parseInt(dayMatch[1]);
          return { ok: recs.length >= target, text: `实际${recs.length}天` };
        }
        // 判定次数类目标
        if (timeMatch && (text.includes('心情') || text.includes('打卡'))) {
          const target = parseInt(timeMatch[1]);
          return { ok: totalMoodCount >= target, text: `实际${totalMoodCount}次` };
        }
        // 无法自动量化的弹性目标
        return { ok: null, text: '' };
      });
      html.push(`<div class="section-block"><h3>🎯 ${range.type==='week'?'本周':'本月'} 3 条目标</h3>
        ${goalsExist
          ? `<div>
              ${goals.filter(g=>g&&g.trim()).map((g,i)=>{
                const ck = goalChecks[i] || {ok:null,text:''};
                const badge = ck.ok === true
                  ? `<span class="goal-check ok" title="${ck.text}">✓</span>`
                  : ck.ok === false
                    ? `<span class="goal-check fail" title="${ck.text}">✗</span>`
                    : ck.text
                      ? `<span class="goal-check unknown" title="${ck.text}">?</span>`
                      : '';
                return `
                <div class="summary-goal-bar">
                  <span style="width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;background:linear-gradient(135deg,#5d4e6d,#2d1b4e);color:#fff;font-size:0.82rem;font-weight:800;flex-shrink:0;">${i+1}</span>
                  <div style="flex:1;line-height:1.7;color:#2c2c2c;font-size:0.97rem;font-weight:500;padding-top:3px;">${escapeHtml(g)}${ck.text?` <small style="color:#888;font-weight:400;">（${ck.text}）</small>`:''}</div>
                  ${badge}
                </div>`;
              }).join('')}
            </div>`
          : `<div class="summary-goal-bar empty">
              还没设本期目标 · 点上方 <b style="margin:0 4px;color:#4fa8c9;">✨ 基于上周期数据推荐 3 条</b> 一键生成，或自己写 3 条（推荐：2 条可量化 + 1 条弹性）
            </div>`
        }
      </div>`);
    })();

    // Stats
    const totalSleep = recs.reduce((s, r) => {
      const c = calcSleepHours(r.fellAsleep, r.wakeUp);
      return c ? s + c.totalMins : s;
    }, 0);
    const avgSleepMin = recs.length ? Math.round(totalSleep / recs.length) : 0;
    const avgSleepH = Math.floor(avgSleepMin/60);
    const avgSleepM = avgSleepMin % 60;
    const weightRecs = recs.filter(r => r.weight != null);
    const avgWeight = weightRecs.length ? (weightRecs.reduce((s,r) => s+r.weight,0)/weightRecs.length).toFixed(1) : '—';
    const weightStart = weightRecs.length ? weightRecs[0].weight : null;
    const weightEnd = weightRecs.length ? weightRecs[weightRecs.length-1].weight : null;
    const weightDelta = (weightStart != null && weightEnd != null) ? (weightEnd - weightStart).toFixed(1) : null;

    // 心情按次统计 + 展开条目带上上下文
    const allMoodEntries = []; // {date, time, mood, sleepMin, taskDone, taskTotal}
    recs.forEach(r => {
      const s = calcSleepHours(r.fellAsleep, r.wakeUp);
      const sleepMin = s ? s.totalMins : null;
      const ts = (r.tasks||[]).map(t => typeof t === 'string' ? { text: t, done: false } : t).filter(t => t.text);
      const taskDone = ts.filter(t => t.done).length;
      const taskTotal = ts.length;
      let moods = Array.isArray(r.moods) && r.moods.length ? r.moods : (r.mood ? [{ time: '20:00', mood: r.mood }] : []);
      moods.forEach(m => allMoodEntries.push({
        date: r.date, time: m.time, mood: m.mood, sleepMin, taskDone, taskTotal
      }));
    });
    const moodCounts = {};
    allMoodEntries.forEach(e => { moodCounts[e.mood] = (moodCounts[e.mood]||0)+1; });
    const topMood = Object.entries(moodCounts).sort((a,b)=>b[1]-a[1])[0];
    const totalMoodCount = allMoodEntries.length;

    // 任务统计（统一规范化）
    let totalTasks = 0, doneTasks = 0;
    const allTasks = []; // {date, text, done, no}
    recs.forEach(r => {
      (r.tasks||[]).forEach((t, i) => {
        const obj = typeof t === 'string' ? { text: t, done: false } : t;
        if (!obj.text) return;
        totalTasks++;
        if (obj.done) doneTasks++;
        allTasks.push({ date: r.date, text: obj.text, done: !!obj.done, no: i+1 });
      });
    });
    const taskRate = totalTasks ? Math.round(doneTasks/totalTasks*100) : 0;

    html.push(`<div class="summary-stats">
      <div class="stat-card">
        <div class="stat-label">记录天数</div>
        <div class="stat-value">${recs.length}<span class="stat-unit">/ ${dates.length}</span></div>
        <div class="stat-sub">完成度 ${dates.length ? Math.round(recs.length/dates.length*100) : 0}%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">平均睡眠</div>
        <div class="stat-value">${avgSleepH}<span class="stat-unit">h ${avgSleepM.toString().padStart(2,'0')}m</span></div>
        <div class="stat-sub">${recs.length ? `共 ${(totalSleep/60).toFixed(1)} 小时` : '暂无数据'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">心情波动性</div>
        <div class="stat-value">${(totalMoodCount/(recs.length||1)).toFixed(1)}<span class="stat-unit">次/天</span></div>
        <div class="stat-sub">${(() => {
          const dm = {};
          allMoodEntries.forEach(e => { (dm[e.date] = dm[e.date] || []).push(e.mood); });
          const fluxDays = Object.values(dm).filter(arr => arr.length >= 3).length;
          return fluxDays + ' 天波动≥3次' + (fluxDays >= recs.length*0.4 ? ' · 情绪起伏较大' : '');
        })()}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">主导心情</div>
        <div class="stat-value" style="font-size:1.4rem;">${topMood ? moodEmoji(topMood[0])+' '+topMood[0] : '—'}</div>
        <div class="stat-sub">${topMood ? `出现 ${topMood[1]} 次 / 共 ${totalMoodCount} 次` : '暂无心情记录'}</div>
      </div>
      <div class="stat-card" style="border-top-color: #ff6b35;">
        <div class="stat-label">任务完成率</div>
        <div class="stat-value">${taskRate}<span class="stat-unit">%</span></div>
        <div class="stat-sub">${doneTasks} / ${totalTasks} 件 · ${totalTasks-doneTasks} 件待完成</div>
      </div>
      <div class="stat-card" style="border-top-color: #4a5568;">
        <div class="stat-label">全勤日</div>
        <div class="stat-value">${recs.filter(r=>{
           const ts=(r.tasks||[]).map(t=>typeof t==='string'?{text:t,done:false}:t).filter(t=>t.text);
           return ts.length>0 && ts.every(t=>t.done);
        }).length}<span class="stat-unit">天</span></div>
        <div class="stat-sub">三件事全部完成的天数</div>
      </div>
    </div>`);

    // Mood distribution
    html.push(`<div class="section-block"><h3>💖 心情分布（按记录次数）</h3>
      <div class="mood-distribution">
        ${MOODS.map(m => {
          const c = moodCounts[m] || 0;
          const active = c > 0;
          return `<div class="mood-bar" style="${active ? '' : 'opacity:0.4;'}">
            <div style="font-size:1.3rem;">${moodEmoji(m)}</div>
            <div class="name">${m}</div>
            <div class="count">${c}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`);

    // Mood timeline (day-by-day flow)
    const dailyMoods = {};
    allMoodEntries.forEach(e => {
      (dailyMoods[e.date] = dailyMoods[e.date] || []).push(e);
    });
    const moodColor = {
      '开心':'#f7c948','平静':'#a8d8ea','充实':'#9cd081','疲惫':'#9c88b2',
      '焦虑':'#ff8a65','难过':'#7aa0d8','愤怒':'#e05252','期待':'#f59bc6','感恩':'#d6b678'
    };
    html.push(`<div class="section-block"><h3>📈 心情波动时间线</h3>
      <div class="summary-list">
        ${Object.keys(dailyMoods).sort().length ? Object.keys(dailyMoods).sort().map(d => {
          const list = dailyMoods[d].sort((a,b) => a.time.localeCompare(b.time));
          const flowItems = list.map((m, i) => {
            const color = moodColor[m.mood] || '#c9a0dc';
            const node = `<span style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:50px;background:#fff;border:1.5px solid ${color};color:#333;font-weight:600;font-size:0.84rem;">
              <span style="font-size:0.72rem;color:#888;letter-spacing:1px;">${m.time}</span>${moodEmoji(m.mood)}<span>${m.mood}</span>
            </span>`;
            return i < list.length - 1 ? node + '<span style="color:#aaa;font-weight:700;margin:0 2px;">→</span>' : node;
          }).join('');
          const wave = list.length >= 2
            ? `<span style="margin-left:auto;font-size:0.78rem;color:${list.length>=3 ? '#b22222' : '#888'};letter-spacing:1px;padding:3px 10px;border-radius:50px;background:${list.length>=3 ? '#fff0ee' : '#f5f5fa'};">波动${list.length-1}次</span>`
            : '';
          return `<div class="summary-row">
            <div class="date">${d.slice(5)}</div>
            <div class="content" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">${flowItems}</div>
            ${wave}
          </div>`;
        }).join('') : '<div class="empty-state" style="padding:30px;"><p>暂无心情数据</p></div>'}
      </div>
    </div>`);

    // Sleep × Mood correlation
    (function() {
      const withCtx = allMoodEntries.filter(e => e.sleepMin != null);
      if (withCtx.length < 3) return; // 样本太少不显示
      const lowSleep = withCtx.filter(e => e.sleepMin < 360); // < 6h
      const normalSleep = withCtx.filter(e => e.sleepMin >= 360);
      const negMoods = ['疲惫', '焦虑', '难过', '愤怒'];
      const negRate = arr => arr.length ? Math.round(arr.filter(e => negMoods.includes(e.mood)).length / arr.length * 100) : 0;
      const posMoods = ['开心', '充实', '期待', '感恩', '平静'];
      const posRate = arr => arr.length ? Math.round(arr.filter(e => posMoods.includes(e.mood)).length / arr.length * 100) : 0;
      html.push(`<div class="section-block"><h3>🔗 睡眠 × 心情 对照</h3>
        <div class="summary-stats" style="margin-bottom:0;">
          <div class="stat-card" style="border-top-color: #e05252;">
            <div class="stat-label">睡眠不足6h 负面心情</div>
            <div class="stat-value">${negRate(lowSleep)}<span class="stat-unit">%</span></div>
            <div class="stat-sub">样本 ${lowSleep.length} 次 · 负面(${negMoods.join('/')})</div>
          </div>
          <div class="stat-card" style="border-top-color: #9cd081;">
            <div class="stat-label">睡眠≥6h 正面心情</div>
            <div class="stat-value">${posRate(normalSleep)}<span class="stat-unit">%</span></div>
            <div class="stat-sub">样本 ${normalSleep.length} 次 · 正面(${posMoods.filter((_,i)=>i<3).join('/')}...)</div>
          </div>
          <div class="stat-card" style="border-top-color: #5d4e6d;">
            <div class="stat-label">结论</div>
            <div class="stat-value" style="font-size:1.15rem;">${
              negRate(lowSleep) > negRate(normalSleep) + 10
                ? '睡得短 → 易负面 😪'
                : (posRate(normalSleep) >= posRate(lowSleep) + 10 ? '睡得好 → 更正面 💫' : '暂未观察到明显差异 · 继续记录')
            }</div>
            <div class="stat-sub">数据随记录积累会越来越准</div>
          </div>
        </div>
      </div>`);
    })();

    // Task completion × Mood correlation
    (function() {
      const withCtx = allMoodEntries.filter(e => e.taskTotal > 0);
      if (withCtx.length < 3) return;
      const splitRate = 0.66; // 完成率 >= 66% = 高完成日
      const highDone = withCtx.filter(e => e.taskTotal && (e.taskDone / e.taskTotal) >= splitRate);
      const lowDone  = withCtx.filter(e => e.taskTotal && (e.taskDone / e.taskTotal) < splitRate);
      const goodMoods = ['开心', '充实', '感恩', '平静', '期待'];
      const gmRate = arr => arr.length ? Math.round(arr.filter(e => goodMoods.includes(e.mood)).length / arr.length * 100) : 0;
      html.push(`<div class="section-block"><h3>🔗 任务完成率 × 心情 对照</h3>
        <div class="summary-stats" style="margin-bottom:0;">
          <div class="stat-card" style="border-top-color: #2d8659;">
            <div class="stat-label">高完成日(≥66%)好心情</div>
            <div class="stat-value">${gmRate(highDone)}<span class="stat-unit">%</span></div>
            <div class="stat-sub">样本 ${highDone.length} 次</div>
          </div>
          <div class="stat-card" style="border-top-color: #ff6b35;">
            <div class="stat-label">低完成日好心情</div>
            <div class="stat-value">${gmRate(lowDone)}<span class="stat-unit">%</span></div>
            <div class="stat-sub">样本 ${lowDone.length} 次</div>
          </div>
          <div class="stat-card" style="border-top-color: #5d4e6d;">
            <div class="stat-label">结论</div>
            <div class="stat-value" style="font-size:1.15rem;">${
              gmRate(highDone) > gmRate(lowDone) + 10
                ? '做完事 → 心情好 🎉'
                : (gmRate(lowDone) > gmRate(highDone) + 10 ? '注意：拖延时反而心情更差？' : '暂未观察到明显差异')
            }</div>
            <div class="stat-sub">高完成日好心情率 ${gmRate(highDone)}% vs 低完成 ${gmRate(lowDone)}%</div>
          </div>
        </div>
      </div>`);
    })();

    // Weight chart
    if (weightRecs.length >= 2) {
      const weights = weightRecs.map(r => r.weight);
      const min = Math.min(...weights) - 0.5;
      const max = Math.max(...weights) + 0.5;
      html.push(`<div class="section-block"><h3>⚖️ 体重变化</h3>
        <div class="weight-chart">
          ${weightRecs.map(r => {
            const h = ((r.weight - min) / (max - min)) * 100;
            return `<div class="weight-bar" style="height:${Math.max(h,5)}%;">
              <div class="w-val">${r.weight}</div>
              <div class="w-date">${r.date.slice(5)}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`);
    }

    // Sleep bars
    const sleepRecs = recs.filter(r => calcSleepHours(r.fellAsleep, r.wakeUp));
    if (sleepRecs.length) {
      const maxH = 12 * 60;
      html.push(`<div class="section-block compact-foldable"><h3>🌙 每日睡眠时长</h3>
        <div>
          ${sleepRecs.map(r => {
            const s = calcSleepHours(r.fellAsleep, r.wakeUp);
            const pct = Math.min(100, s.totalMins / maxH * 100);
            return `<div class="sleep-bar-row">
              <div class="d">${r.date.slice(5)}</div>
              <div class="sleep-bar-track"><div class="sleep-bar-fill" style="width:${pct}%;"></div></div>
              <div class="h">${s.label}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`);
    }

    // Events summary
    const eventsRecs = recs.filter(r => r.events);
    html.push(`<div class="section-block"><h3>📝 事件回顾</h3>
      <div class="summary-list">
        ${eventsRecs.length ? eventsRecs.map(r => `<div class="summary-row">
          <div class="date">${r.date.slice(5)}</div>
          <div class="content" style="white-space:pre-wrap;">${escapeHtml(r.events)}</div>
        </div>`).join('') : '<div class="empty-state" style="padding:30px;"><p>本时段没有事件记录</p></div>'}
      </div>
    </div>`);

    // Tasks summary (用上面预计算的 allTasks)
    html.push(`<div class="section-block"><h3>🎯 要事清单</h3>
      <div class="summary-list">
        ${allTasks.length ? allTasks.map(t => `<div class="summary-row">
          <div class="date">${t.date.slice(5)} · #${t.no}</div>
          <div class="content" style="${t.done ? 'text-decoration: line-through; opacity: 0.55;' : ''}">${escapeHtml(t.text)}</div>
          <div class="tag" style="background:${t.done ? '#2d8659' : '#b22222'};color:#fff;">${t.done ? '✓ 已完成' : '○ 待办'}</div>
        </div>`).join('') : '<div class="empty-state" style="padding:30px;"><p>暂无要事记录</p></div>'}
      </div>
    </div>`);

    // Undone tasks list
    const undone = allTasks.filter(t => !t.done);
    html.push(`<div class="section-block" style="${undone.length ? '' : 'opacity:0.75;'}"><h3>📋 未完成清单${undone.length ? '  <span style="color:#b22222;font-size:0.9rem;">× ' + undone.length + '</span>' : ''}</h3>
      <div class="summary-list">
        ${undone.length ? undone.map(t => `<div class="summary-row" style="border-left: 3px solid #b22222; background: #fff8f6;">
          <div class="date">${t.date.slice(5)} · #${t.no}</div>
          <div class="content">${escapeHtml(t.text)}</div>
          <div class="tag" style="background:#b22222;color:#fff;">NO.${t.no}</div>
        </div>`).join('') : '<div class="empty-state" style="padding:30px;"><p>🎊 恭喜！没有未完成的任务</p></div>'}
      </div>
    </div>`);

    // ==================== 💡 核心建议 ====================
    (function() {
      const advices = []; // {prio:'high'|'mid'|'low', title, body}
      const negMoods = ['疲惫', '焦虑', '难过', '愤怒'];
      const posMoods = ['开心', '充实', '期待', '感恩', '平静'];
      const goodMoods = ['开心', '充实', '感恩', '平静', '期待'];

      // === 记录完成度 ===
      const missing = dates.length - recs.length;
      if (missing / dates.length >= 0.4) {
        advices.push({ prio:'high',
          title:'记录习惯需坚持',
          body:`${range.label}共缺记 ${missing} 天（${Math.round(missing/dates.length*100)}%）。建议在每天睡前最后一件事完成填写，或设置一个每日固定提醒。先坚持 7 天就会形成稳定习惯。` });
      } else if (missing === 0) {
        advices.push({ prio:'low', title:'全勤！保持住', body:`本时段全部 ${dates.length} 天都记录了，非常自律的习惯。保持节奏即可。` });
      }

      // === 睡眠 ===
      const withSleepCtx = allMoodEntries.filter(e => e.sleepMin != null);
      if (withSleepCtx.length >= 3) {
        const lowSleep = withSleepCtx.filter(e => e.sleepMin < 360);
        const normalSleep = withSleepCtx.filter(e => e.sleepMin >= 360);
        const nRateLow = lowSleep.length ? Math.round(lowSleep.filter(e => negMoods.includes(e.mood)).length / lowSleep.length * 100) : 0;
        const nRateNorm = normalSleep.length ? Math.round(normalSleep.filter(e => negMoods.includes(e.mood)).length / normalSleep.length * 100) : 0;
        const pRateNorm = normalSleep.length ? Math.round(normalSleep.filter(e => posMoods.includes(e.mood)).length / normalSleep.length * 100) : 0;
        const pRateLow = lowSleep.length ? Math.round(lowSleep.filter(e => posMoods.includes(e.mood)).length / lowSleep.length * 100) : 0;
        if (avgSleepMin > 0 && avgSleepMin < 420) { // < 7h
          advices.push({ prio:'high',
            title:'平均睡眠不足 7h',
            body:`本时段平均睡眠仅 ${avgSleepH}h${avgSleepM.toString().padStart(2,'0')}m。建议目标：上床时间整体提前 30 分钟（比如把「关灯」从 23:30 调到 23:00），下周再对比一次看心情是否有明显改善。` });
        }
        if (nRateLow > nRateNorm + 10) {
          advices.push({ prio:'mid',
            title:'睡眠不足时明显更容易焦虑/疲惫',
            body:`睡眠<6h的日子，负面心情出现率为 ${nRateLow}%，而睡眠≥6h时仅 ${nRateNorm}%。数据支持：「睡好觉=心情稳定」，优先保障 6 小时底线。` });
        } else if (pRateNorm >= pRateLow + 10) {
          advices.push({ prio:'low',
            title:'睡眠充足更容易有好心情',
            body:`睡眠≥6h时出现「开心/充实/感恩」等正面心情比例为 ${pRateNorm}%，比睡不够（${pRateLow}%）高出 ${pRateNorm-pRateLow} 个百分点。` });
        }
      } else if (recs.length >= 2 && avgSleepMin > 0 && avgSleepMin < 420) {
        advices.push({ prio:'mid', title:'平均睡眠不足 7h（样本积累中）', body:`当前平均 ${avgSleepH}h${avgSleepM.toString().padStart(2,'0')}m。先再多记录几天，看看睡眠时间和心情波动的关系。` });
      }

      // === 体重 ===
      if (weightDelta != null) {
        const want = 0; // 用户没说目标，所以只给趋势解读
        if (parseFloat(weightDelta) >= 2) {
          advices.push({ prio:'high',
            title:'体重上升较快（+'+weightDelta+'kg）',
            body:`本时段体重从期初 ${weightStart}kg 到期末 ${weightEnd}kg，增加 ${weightDelta}kg。建议在第三件事固定放一个每日微运动（比如 15 分钟散步），下周期对比一下。` });
        } else if (parseFloat(weightDelta) <= -2) {
          advices.push({ prio:'low',
            title:'体重持续下降趋势（'+weightDelta+'kg）',
            body:`期初 ${weightStart}kg → 期末 ${weightEnd}kg，减重 ${Math.abs(weightDelta)}kg。如果并非刻意减重，可留意是否和压力/吃饭不规律有关联。` });
        }
      }

      // === 任务完成率 ===
      if (totalTasks > 0) {
        if (taskRate < 50) {
          advices.push({ prio:'high',
            title:`任务完成率仅 ${taskRate}%`,
            body:`未完成 ${undone.length} 件。建议：① 第三件事换成"保底任务"（5 分钟能做完的小事），先保完成率建立成就感；② 连续 3 天没完成的大事件，拆成两天分别完成。` });
        } else if (taskRate === 100) {
          advices.push({ prio:'low', title:'100% 任务完成率', body:'全部完成！保持当前分配节奏即可，下周期可以略加挑战一点难度。' });
        }
      }
      const withTaskCtx = allMoodEntries.filter(e => e.taskTotal > 0);
      if (withTaskCtx.length >= 3) {
        const splitRate = 0.66;
        const highDone = withTaskCtx.filter(e => (e.taskDone/e.taskTotal) >= splitRate);
        const lowDone  = withTaskCtx.filter(e => (e.taskDone/e.taskTotal) < splitRate);
        const gmRate = arr => arr.length ? Math.round(arr.filter(e => goodMoods.includes(e.mood)).length / arr.length * 100) : 0;
        if (gmRate(highDone) >= gmRate(lowDone) + 10) {
          advices.push({ prio:'mid',
            title:'做完事情的那几天，心情明显更好',
            body:`高完成日（≥66%）好心情率 ${gmRate(highDone)}%，低完成日只有 ${gmRate(lowDone)}%。数据支持「小步快跑完成几件事」比「拖 3 件等明天」更好。` });
        }
      }

      // === 心情 ===
      if (totalMoodCount > 0) {
        const negCount = allMoodEntries.filter(e => negMoods.includes(e.mood)).length;
        const negPct = Math.round(negCount/totalMoodCount*100);
        if (negPct >= 50) {
          advices.push({ prio:'high',
            title:`负面心情占比 ${negPct}%，需关注`,
            body:`9 种心情里「疲惫/焦虑/难过/愤怒」占了一半以上。建议每天多加一条「感恩」记录（比如"感谢今天喝到好喝的咖啡"这种 30 秒小事），能有效把心情基线拉正。` });
        }
        const fullDays = recs.filter(r => {
          const ts = (r.tasks||[]).map(t => typeof t==='string'?{text:t,done:false}:t).filter(t=>t.text);
          return ts.length>0 && ts.every(t=>t.done);
        }).length;
        if (fullDays === 0 && recs.length >= 4) {
          advices.push({ prio:'mid',
            title:'没有出现过"三件事全完成"的日子',
            body:'建议把"第二件事"改成一个轻量任务（比如读3页书），出现第一个全勤日之后，心态会有明显变化。' });
        }
      }

      // === 未完成清单提示 ===
      if (undone.length >= 5) {
        advices.push({ prio:'mid',
          title:`积压了 ${undone.length} 件未完成`,
          body:`挑出 TOP2 最想做完的，本周末/下月优先解决；其余要么延期、要么直接划掉（承认做不完是心理减负的第一步）。` });
      }

      // === 输出 ===
      if (advices.length === 0) {
        html.push(`<div class="section-block"><h3>💡 核心建议</h3>
          <div class="advice-empty">✓ 各指标正常，暂无明显需要改进的点 · 保持节奏即可</div>
        </div>`);
      } else {
        const prioOrder = { high:0, mid:1, low:2 };
        advices.sort((a,b) => prioOrder[a.prio] - prioOrder[b.prio]);
        html.push(`<div class="section-block"><h3>💡 核心建议（${advices.length} 条）</h3>
          <div>
            ${advices.map(a => {
              const cls = a.prio === 'high' ? 'p-high' : (a.prio === 'mid' ? 'p-mid' : 'p-low');
              const tag = a.prio === 'high' ? '高优先级' : (a.prio === 'mid' ? '中优先级' : '低优先级');
              return `<div class="advice-row ${cls}">
                <span class="tag-prio">${tag}</span>
                <div class="a-body"><span class="a-ti">${a.title}：</span>${a.body}</div>
              </div>`;
            }).join('')}
          </div>
        </div>`);
      }
    })();

    // 月度：4周完成率横向对比
    if (range.type === 'month') {
      const weeks = [[],[],[],[]];
      dates.forEach(dstr => {
        const day = parseInt(dstr.split('-')[2]);
        const wi = Math.min(3, Math.floor((day-1)/7));
        weeks[wi].push(dstr);
      });
      const weekData = weeks.map((wk, i) => {
        const wkRecs = wk.map(d => all[d]).filter(r => r);
        let tTotal = 0, tDone = 0;
        wkRecs.forEach(r => {
          (r.tasks||[]).forEach(t => {
            const obj = typeof t === 'string' ? {text:t,done:false} : t;
            if (!obj.text) return;
            tTotal++;
            if (obj.done) tDone++;
          });
        });
        const rate = tTotal ? Math.round(tDone/tTotal*100) : 0;
        return { label: 'W'+(i+1), rate, recCount: wkRecs.length, tTotal, tDone };
      });
      const colors = ['#e05252','#ff8a65','#f7c948','#9cd081'];
      html.push(`<div class="section-block"><h3>📊 4 周完成率对比</h3>
        <div class="week-compare">
          ${weekData.map(w => `
            <div class="week-compare-row">
              <div class="wc-label">${w.label}</div>
              <div class="wc-track"><div class="wc-fill" style="width:${w.rate}%;background:${colors[Math.min(3,Math.floor(w.rate/25))]};">${w.tTotal?w.rate+'%':'无数据'}</div></div>
              <div style="font-size:0.78rem;color:#888;min-width:70px;">${w.tDone}/${w.tTotal}件 · ${w.recCount}天记录</div>
            </div>`).join('')}
        </div>
      </div>`);
    }

    // Color themes used
    const themeCount = {};
    inRange.forEach(x => {
      if (x.rec) {
        const idx = getThemeIndex(x.date);
        const name = COLOR_THEMES[idx].name;
        themeCount[name] = (themeCount[name]||0)+1;
      }
    });
    html.push(`<div class="section-block compact-foldable"><h3>🎨 本时段色彩</h3>
      <div class="mood-distribution">
        ${COLOR_THEMES.map((t, i) => {
          const c = themeCount[t.name] || 0;
          return `<div class="mood-bar">
            <div style="width:20px;height:20px;border-radius:50%;background:${themePreview(i)};"></div>
            <div class="name">${t.name}</div>
            <div class="count">${c}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`);

    // 紧凑模式展开按钮
    html.push(`<div class="compact-fold-toggle" onclick="document.querySelectorAll('.compact-foldable.folded').forEach(function(el){el.classList.remove('folded');this.style.display='none';}.bind(this))">📋 展开折叠的内容（睡眠时长 · 色彩统计）</div>`);

    document.getElementById('summaryContent').innerHTML = html.join('');
    // 紧凑模式：渲染后对折叠元素应用 folded
    if (document.body.classList.contains('compact-mode')) {
      document.querySelectorAll('.compact-foldable').forEach(el => el.classList.add('folded'));
    }
  }

  const YEAR_GOALS_KEY = 'daily_journal_year_goals_v1';

  // ========= YEAR SUMMARY =========
  function generateYearSummary(year) {
    const all = loadRecords();
    const keys = Object.keys(all).sort();
    const inYear = keys.filter(d => d.startsWith(year+'-'));
    const recs = inYear.map(d => all[d]);
    const html = [];
    const yearStart = new Date(year,0,1);
    const yearEnd = new Date(year,11,31);
    const msPerDay = 86400000;
    const totalDays = Math.round((yearEnd - yearStart)/msPerDay)+1; // 365 or 366
    const negMoods = ['疲惫', '焦虑', '难过', '愤怒'];
    const posMoods = ['开心', '充实', '期待', '感恩', '平静'];

    // --- 基础统计 ---
    const totalSleepMin = recs.reduce((s, r) => {
      const c = calcSleepHours(r.fellAsleep, r.wakeUp);
      return c ? s + c.totalMins : s;
    }, 0);
    const avgSleepMin = recs.length ? Math.round(totalSleepMin / recs.length) : 0;
    const avgSH = Math.floor(avgSleepMin/60), avgSM = avgSleepMin%60;

    const weightRecs = recs.filter(r => r.weight != null).sort((a,b)=>a.date && b.date ? a.date.localeCompare(b.date) : 0);
    const avgWeight = weightRecs.length ? (weightRecs.reduce((s,r)=>s+r.weight,0)/weightRecs.length).toFixed(1) : '—';
    const wFirst = weightRecs.length ? weightRecs[0].weight : null;
    const wLast  = weightRecs.length ? weightRecs[weightRecs.length-1].weight : null;
    const wMax   = weightRecs.length ? Math.max(...weightRecs.map(r=>r.weight)) : null;
    const wMin   = weightRecs.length ? Math.min(...weightRecs.map(r=>r.weight)) : null;
    const wDelta = (wFirst!=null && wLast!=null) ? (wLast - wFirst) : null;

    // 心情条目 + 次数
    const allMoodEntries = [];
    recs.forEach(r => {
      const s = calcSleepHours(r.fellAsleep, r.wakeUp);
      const sleepMin = s ? s.totalMins : null;
      const ts = (r.tasks||[]).map(t => typeof t === 'string' ? { text: t, done: false } : t).filter(t => t.text);
      const taskDone = ts.filter(t => t.done).length;
      const taskTotal = ts.length;
      let moods = Array.isArray(r.moods) && r.moods.length ? r.moods : (r.mood ? [{ time: '20:00', mood: r.mood }] : []);
      moods.forEach(m => allMoodEntries.push({ date: r.date, time: m.time, mood: m.mood, sleepMin, taskDone, taskTotal, note: m.note||'' }));
    });
    const moodCounts = {};
    allMoodEntries.forEach(e => { moodCounts[e.mood] = (moodCounts[e.mood]||0)+1; });
    const topMood = Object.entries(moodCounts).sort((a,b)=>b[1]-a[1])[0];

    // 任务统计
    let totalTasks=0, doneTasks=0;
    recs.forEach(r => {
      (r.tasks||[]).forEach(t => {
        const obj = typeof t === 'string' ? { text: t, done: false } : t;
        if (!obj.text) return;
        totalTasks++; if (obj.done) doneTasks++;
      });
    });
    const taskRate = totalTasks ? Math.round(doneTasks/totalTasks*100) : 0;
    const fullDays = recs.filter(r => {
      const ts = (r.tasks||[]).map(t => typeof t==='string'?{text:t,done:false}:t).filter(t=>t.text);
      return ts.length>0 && ts.every(t=>t.done);
    }).length;

    // ==================== 1. Hero 大标题 ====================
    html.push(`<div class="year-hero">
      <div class="big">${year}</div>
      <div class="sub-title">ANNUAL · 回 顾 与 展 望</div>
      <div class="meta">
        <div><strong>${recs.length}</strong>记录天数 / ${totalDays}</div>
        <div><strong>${(totalSleepMin/60).toFixed(0)}</strong>累计睡眠(小时)</div>
        <div><strong>${allMoodEntries.length}</strong>心情记录次数</div>
        <div><strong>${doneTasks}</strong>任务已完成</div>
      </div>
    </div>`);

    if (recs.length === 0) {
      html.push(`<div class="section-block" style="text-align:center;padding:50px 20px;color:#888;letter-spacing:2px;">
        <div style="font-size:3rem;margin-bottom:16px;">📭</div>
        <div>${year} 年还没有任何记录。先去「记录」tab 填 7 天再回来，这里会变成一份很有仪式感的年度报告～</div>
      </div>`);
      document.getElementById('summaryContent').innerHTML = html.join('');
      return;
    }

    // ==================== 2. 8大核心指标卡 ====================
    html.push(`<div class="section-block"><h3>📊 ${year} · 年度核心指标</h3>
      <div class="year-stats">
        <div class="ys"><div class="yl">Recorded Days</div><div class="yv">${recs.length}<span class="yu"> 天</span></div></div>
        <div class="ys" style="border-top-color:#4fa8c9;"><div class="yl">Avg Sleep</div><div class="yv">${avgSH}<span class="yu">h${avgSM.toString().padStart(2,'0')}m</span></div></div>
        <div class="ys" style="border-top-color:#2d1b4e;"><div class="yl">Avg Weight</div><div class="yv">${avgWeight}<span class="yu">kg</span></div></div>
        <div class="ys" style="border-top-color:${wDelta==null?'#888':(wDelta>0?'#b22222':'#2d8659')};">
          <div class="yl">Weight Year△</div>
          <div class="yv">${wDelta==null?'—':(wDelta>0?'↗ +':'↘ ')+wDelta.toFixed(1)}<span class="yu">kg</span></div>
        </div>
        <div class="ys" style="border-top-color:#c9a0dc;"><div class="yl">主导心情</div><div class="yv" style="font-size:1.35rem;">${topMood ? moodEmoji(topMood[0])+' '+topMood[0] : '—'}</div></div>
        <div class="ys" style="border-top-color:#daa520;"><div class="yl">Mood Logs</div><div class="yv">${allMoodEntries.length}<span class="yu"> 次</span></div></div>
        <div class="ys" style="border-top-color:#ff6b35;"><div class="yl">Task Done</div><div class="yv">${taskRate}<span class="yu"> %</span></div></div>
        <div class="ys" style="border-top-color:#4a5568;"><div class="yl">Full Attendance</div><div class="yv">${fullDays}<span class="yu"> 天</span></div></div>
      </div>
    </div>`);

    // ==================== 3. 年度关键词 ====================
    (function() {
      const keywords = [];
      if (topMood) keywords.push({ cls:'kw', text:`✨ ${topMood[0]}（${topMood[1]} 次）` });
      // 从事件+任务里抽2字滑窗词频
      const text = recs.map(r => (r.events||'') + ' ' + (r.tasks||[]).map(t => typeof t==='string'?t:t.text).join(' ')).join('');
      const clean = text.replace(/[\s,\.，。、！？!?~～、。…·—\-\d"'（）()【】\[\]《》<>a-zA-Z]/g,'');
      const freq = {};
      for (let i=0; i+1<clean.length; i++) {
        const w = clean.substr(i,2);
        freq[w] = (freq[w]||0)+1;
      }
      // 过滤掉频率只有1的 和一些常见无意义双字词
      const stop = {'今天':1,'我们':1,'自己':1,'还是':1,'这个':1,'那个':1,'一个':1,'已经':1,'没有':1,'有点':1,'因为':1,'所以':1,'但是':1,'可以':1,'然后':1,'真的':1,'感觉':1,'开始':1,'最后':1,'之后':1,'什么':1,'的时候':1};
      const topWords = Object.entries(freq)
        .filter(([w,c]) => c >= 2 && !stop[w])
        .sort((a,b)=>b[1]-a[1])
        .slice(0, 4);
      topWords.forEach(([w,c], i) => {
        const cls = ['kw k2','kw k3','kw k4','kw k5'][i] || 'kw';
        keywords.push({ cls, text:`${w} × ${c}` });
      });
      // 体重/任务/睡眠 词
      if (wDelta != null && parseFloat(wDelta) >= 3) keywords.push({ cls:'kw k5', text: `体重+${wDelta.toFixed(1)}kg` });
      if (wDelta != null && parseFloat(wDelta) <= -3) keywords.push({ cls:'kw k2', text: `体重${wDelta.toFixed(1)}kg` });
      if (taskRate >= 85) keywords.push({ cls:'kw k3', text: `任务${taskRate}% · 高完成率` });
      if (fullDays >= 10) keywords.push({ cls:'kw', text: `全勤${fullDays}天` });
      html.push(`<div class="section-block"><h3>🌟 ${year} 年度关键词</h3>
        <div class="year-keywords">
          ${keywords.map(k => `<span class="${k.cls}">${k.text}</span>`).join('') || '<span style="color:#999;letter-spacing:2px;">继续多记录，关键词会越来越准～</span>'}
        </div>
      </div>`);
    })();

    // ==================== 4. 体重：起止 + 最高最低 ====================
    if (weightRecs.length >= 2) {
      html.push(`<div class="section-block"><h3>⚖️ 体重跨度（${weightRecs.length} 天有数据）</h3>
        <div class="summary-stats" style="margin-bottom:0;">
          <div class="stat-card"><div class="stat-label">年初（首次记录）</div><div class="stat-value">${wFirst}<span class="stat-unit">kg</span></div></div>
          <div class="stat-card"><div class="stat-label">年末（末次记录）</div><div class="stat-value">${wLast}<span class="stat-unit">kg</span></div></div>
          <div class="stat-card" style="border-top-color:#b22222;"><div class="stat-label">年度最高</div><div class="stat-value">${wMax}<span class="stat-unit">kg</span></div></div>
          <div class="stat-card" style="border-top-color:#4fa8c9;"><div class="stat-label">年度最低</div><div class="stat-value">${wMin}<span class="stat-unit">kg</span></div></div>
          <div class="stat-card" style="border-top-color:${wDelta>0?'#b22222':'#2d8659'};"><div class="stat-label">年度变化</div><div class="stat-value">${wDelta>0?'↗ +':'↘ '}${wDelta.toFixed(1)}<span class="stat-unit">kg</span></div></div>
        </div>
      </div>`);
    }

    // ==================== 5. 心情最好/最差月 · 睡眠最好/最差月 · 完成率最高月 ====================
    (function() {
      const months = {}; // '01'..'12'
      for (let i=1; i<=12; i++) {
        const mk = String(i).padStart(2,'0');
        months[mk] = { moodPos:0, moodNeg:0, moodTot:0, sleepMins:0, sleepCnt:0, tasks:0, tasksDone:0, recs:0 };
      }
      allMoodEntries.forEach(e => {
        const mk = e.date.slice(5,7);
        if (!months[mk]) return;
        months[mk].moodTot++;
        if (posMoods.includes(e.mood)) months[mk].moodPos++;
        if (negMoods.includes(e.mood)) months[mk].moodNeg++;
        if (e.sleepMin != null) { months[mk].sleepMins += e.sleepMin; months[mk].sleepCnt++; }
      });
      recs.forEach(r => {
        const mk = r.date.slice(5,7);
        if (!months[mk]) return;
        months[mk].recs++;
        (r.tasks||[]).forEach(t => {
          const obj = typeof t === 'string' ? { text:t, done:false } : t;
          if (!obj.text) return;
          months[mk].tasks++; if (obj.done) months[mk].tasksDone++;
        });
      });

      function rate(v,t) { return t>0 ? v/t : null; }
      const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

      // 心情最好月
      let bestMood=[], worstMood=[], bestSleep=[], worstSleep=[], bestTask=[];
      let bm=-1, wm=2, bs=-1, ws=9999999, bt=-1;
      for (let i=1; i<=12; i++) {
        const mk = String(i).padStart(2,'0');
        const m = months[mk];
        // 心情
        if (m.moodTot >= 3) {
          const r = rate(m.moodPos, m.moodTot);
          if (r > bm) { bm = r; bestMood = [i]; } else if (r === bm) bestMood.push(i);
          const nr = rate(m.moodNeg, m.moodTot);
          if (nr < wm) { wm = nr; worstMood = [i]; } else if (nr === wm) worstMood.push(i);
        } else if (m.moodTot > 0 && bm === -1) {
          // 样本少的垫底
          const r = rate(m.moodPos, m.moodTot);
          if (r > bm) { bm = r; bestMood = [i]; }
          const nr = rate(m.moodNeg, m.moodTot);
          if (nr < wm) { wm = nr; worstMood = [i]; }
        }
        // 睡眠
        if (m.sleepCnt >= 2) {
          const a = m.sleepMins/m.sleepCnt;
          if (a > bs) { bs = a; bestSleep = [i]; } else if (a === bs) bestSleep.push(i);
          if (a < ws) { ws = a; worstSleep = [i]; } else if (a === ws) worstSleep.push(i);
        }
        // 任务
        if (m.tasks >= 2) {
          const r = rate(m.tasksDone, m.tasks);
          if (r > bt) { bt = r; bestTask = [i]; } else if (r === bt) bestTask.push(i);
        }
      }

      const fmtMonths = arr => arr.map(i => monthNames[i-1]).join(' / ');
      const fmtPct = v => v==-1||v==2 ? '—' : Math.round(v*100)+'%';
      const fmtHour = min => min===-1||min===9999999 ? '—' : `${Math.floor(min/60)}h${Math.round(min%60).toString().padStart(2,'0')}m`;

      html.push(`<div class="section-block"><h3>🌙 ${year} 年度之「最」</h3>
        <div class="summary-stats" style="margin-bottom:0;">
          <div class="stat-card" style="border-top-color:#9cd081;">
            <div class="stat-label">心情最好月</div>
            <div class="stat-value" style="font-size:1.3rem;">${bestMood.length ? fmtMonths(bestMood) : '—'}</div>
            <div class="stat-sub">正面心情率 ${fmtPct(bm)}</div>
          </div>
          <div class="stat-card" style="border-top-color:#e05252;">
            <div class="stat-label">心情起伏最大月</div>
            <div class="stat-value" style="font-size:1.3rem;">${worstMood.length ? fmtMonths(worstMood) : '—'}</div>
            <div class="stat-sub">负面心情率 ${fmtPct(wm)}</div>
          </div>
          <div class="stat-card" style="border-top-color:#4fa8c9;">
            <div class="stat-label">睡得最好月</div>
            <div class="stat-value" style="font-size:1.3rem;">${bestSleep.length ? fmtMonths(bestSleep) : '—'}</div>
            <div class="stat-sub">平均 ${fmtHour(bs)}</div>
          </div>
          <div class="stat-card" style="border-top-color:#6b5878;">
            <div class="stat-label">睡得最差月</div>
            <div class="stat-value" style="font-size:1.3rem;">${worstSleep.length ? fmtMonths(worstSleep) : '—'}</div>
            <div class="stat-sub">平均 ${fmtHour(ws)}</div>
          </div>
          <div class="stat-card" style="border-top-color:#daa520;">
            <div class="stat-label">执行力最高月</div>
            <div class="stat-value" style="font-size:1.3rem;">${bestTask.length ? fmtMonths(bestTask) : '—'}</div>
            <div class="stat-sub">任务完成率 ${bt<0?'—':Math.round(bt*100)+'%'}</div>
          </div>
        </div>
      </div>`);

      // ==================== 6. 月度完成率热图 12 格 ====================
      html.push(`<div class="section-block"><h3>🔥 月度完成率热力图</h3>
        <div class="month-grid">
          ${Array.from({length:12}, (_,i)=>{
            const mk = String(i+1).padStart(2,'0');
            const m = months[mk];
            const r = m.tasks ? m.tasksDone/m.tasks : (m.recs ? 0.001 : 0);
            let bg;
            if (!m.recs) bg = '#eef0f5';
            else if (r === 0.001) bg = '#cfd3dc'; // 有记录但没写任务
            else if (r < 0.34) bg = '#e05252';
            else if (r < 0.66) bg = '#ff8a65';
            else if (r < 0.85) bg = '#daa520';
            else if (r < 1)    bg = '#9cd081';
            else                bg = '#2d8659';
            const txt = r===0.001 ? '·' : (m.tasks ? Math.round(r*100)+'%' : (m.recs?'0%':'—'));
            const color = bg==='#eef0f5' ? '#b5bac6' : '#fff';
            return `<div class="mg-cell" style="background:${bg};color:${color};" title="${monthNames[i]} · 完成率 ${r===0.001?'无任务数据':(m.tasks?Math.round(r*100)+'%':'无记录')}（记录${m.recs}天）">
              <div class="mg-num">${i+1}月</div><div class="mg-val">${txt}</div>
            </div>`;
          }).join('')}
        </div>
        <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:0.8rem;color:#666;">
          <span>图例：</span>
          <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:16px;height:16px;border-radius:4px;background:#eef0f5;border:1px solid #ddd;"></span>无记录</span>
          <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:16px;height:16px;border-radius:4px;background:#e05252;"></span><34%</span>
          <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:16px;height:16px;border-radius:4px;background:#ff8a65;"></span>34-66%</span>
          <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:16px;height:16px;border-radius:4px;background:#daa520;"></span>66-85%</span>
          <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:16px;height:16px;border-radius:4px;background:#9cd081;"></span>85-100%</span>
          <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:16px;height:16px;border-radius:4px;background:#2d8659;"></span>100%</span>
        </div>
      </div>`);
    })();

    // ==================== 7. 3 大亮点 + 3 大改进点 ====================
    (function() {
      const highlights = [];
      const improvements = [];
      // 亮点
      if (fullDays >= 3) highlights.push(`全勤（三件事全部完成）${fullDays} 天 · 自律感拉满 ✨`);
      if (recs.length / totalDays >= 0.85) highlights.push(`年度记录完成度 ${Math.round(recs.length/totalDays*100)}%，已经是相当稳定的长期习惯 🌿`);
      if (recs.length >= 300) highlights.push(`全年记录超过 300 天（${recs.length}天），数据量足够反映身体周期的真实规律 📚`);
      if (taskRate >= 80) highlights.push(`年度任务完成率 ${taskRate}%，说做就做的执行力 💯`);
      if (wDelta != null && parseFloat(wDelta) <= -3) highlights.push(`体重年初 ${wFirst}kg → 年末 ${wLast}kg，减重 ${Math.abs(wDelta).toFixed(1)}kg，健康成果很显著 ⚖️↘`);
      if (allMoodEntries.length) {
        const neg = allMoodEntries.filter(e => negMoods.includes(e.mood)).length;
        const pos = allMoodEntries.filter(e => posMoods.includes(e.mood)).length;
        if (pos >= neg * 1.5) highlights.push(`正面心情（${pos}次）∶负面心情（${neg}次）= ${(pos/Math.max(neg,1)).toFixed(1)}∶1，情绪整体积极向上 ☀️`);
      }
      if (avgSleepMin >= 450) highlights.push(`全年平均睡眠 ${avgSH}h${avgSM.toString().padStart(2,'0')}m（≥ 7.5h），睡眠基础十分扎实 🌙`);
      if (allMoodEntries.length >= 200) highlights.push(`心情记录超过 ${allMoodEntries.length} 次，已经是真正的情绪日记习惯 🌦️`);
      while (highlights.length < 3) highlights.push('（继续多记录，下一年的亮点会更具体）');

      // 改进点
      if (recs.length / totalDays < 0.6) improvements.push(`记录完成度 ${Math.round(recs.length/totalDays*100)}%，缺记 ${totalDays-recs.length} 天。建议新年设定「每天睡前最后一件事」的固定动作，先连 30 天。`);
      if (avgSleepMin < 390 && avgSleepMin > 0) improvements.push(`平均睡眠仅 ${avgSH}h${avgSM.toString().padStart(2,'0')}m（< 6.5h），长期会累积疲惫。新年目标：每周至少 4 天睡够 7h。`);
      if (taskRate < 55) improvements.push(`年度任务完成率仅 ${taskRate}%。新年建议：每天最多只保留 2 件必须完成的任务，第 3 件定为"锦上添花"的可选项。`);
      if (allMoodEntries.length) {
        const neg = allMoodEntries.filter(e => negMoods.includes(e.mood)).length;
        if (neg >= allMoodEntries.length * 0.45) improvements.push(`负面心情占比 ${Math.round(neg/allMoodEntries.length*100)}%。建议新年每天强制加一条「感恩/小确幸」，用 66 天把心态基线拉正。`);
      }
      if (wDelta != null && parseFloat(wDelta) >= 3) improvements.push(`体重年度上升 ${wDelta.toFixed(1)}kg。建议新年把「15分钟散步」固定到第 2 或第 3 件事，先观察一个季度的变化。`);
      if (allMoodEntries.length < recs.length) improvements.push(`心情记录次数（${allMoodEntries.length}次）低于记录天数（${recs.length}天）。新年可以试着把心情记录当成"即时情绪打卡"，一有波动就记。`);
      if (fullDays === 0 && recs.length >= 30) improvements.push('全年没有出现过"三件事全完成"的日子。新年先把一件事换成 5 分钟级别的超小事，先出现第一个全勤日。');
      while (improvements.length < 3) improvements.push('（今年的整体状态良好，明年保持即可·）');

      html.push(`<div class="section-block">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
          <div>
            <h3 style="border-color:#9cd081;color:#255638;">🌟 年度 3 大亮点</h3>
            <div style="display:flex;flex-direction:column;gap:12px;">
              ${highlights.slice(0,3).map((t,i)=>`<div class="advice-row p-low"><span class="tag-prio">NO.${i+1}</span><div class="a-body">${t}</div></div>`).join('')}
            </div>
          </div>
          <div>
            <h3 style="border-color:#ff8a65;color:#8c3d52;">🌱 年度 3 大改进点</h3>
            <div style="display:flex;flex-direction:column;gap:12px;">
              ${improvements.slice(0,3).map((t,i)=>`<div class="advice-row p-mid"><span class="tag-prio">NO.${i+1}</span><div class="a-body">${t}</div></div>`).join('')}
            </div>
          </div>
        </div>
      </div>`);
    })();

    // ==================== 8. 新年目标（可编辑） ====================
    const goals = loadYearGoals()[year] || ['','',''];
    html.push(`<div class="section-block">
      <h3>🎯 ${year+1} 年度目标（写 3 条，本地自动保存）</h3>
      <div class="goal-card">
        <div style="font-size:0.85rem;color:#777;letter-spacing:2px;margin-bottom:12px;">目标要具体可衡量（"体重 -2kg"比"减肥"好，"读完 12 本书"比"多读书"好）。</div>
        <input type="text" id="yearGoal1" placeholder="目标 1：例如：每月读完 1 本书（全年≥12本）" value="${escapeAttr(goals[0]||'')}">
        <input type="text" id="yearGoal2" placeholder="目标 2：例如：全年 200 天睡够 7 小时" value="${escapeAttr(goals[1]||'')}">
        <input type="text" id="yearGoal3" placeholder="目标 3：例如：体重控制在 [63, 66] kg 区间" value="${escapeAttr(goals[2]||'')}">
        <button type="button" class="btn btn-primary btn-sm" id="saveYearGoalsBtn" style="margin-top:8px;">💾 保存目标</button>
      </div>
    </div>`);

    document.getElementById('summaryContent').innerHTML = html.join('');

    // 绑定按钮
    const saveBtn = document.getElementById('saveYearGoalsBtn');
    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        const allGoals = loadYearGoals();
        allGoals[year] = [
          document.getElementById('yearGoal1').value.trim(),
          document.getElementById('yearGoal2').value.trim(),
          document.getElementById('yearGoal3').value.trim(),
        ];
        saveYearGoals(allGoals);
        toast('✓ 年度目标已保存');
      });
    }
  }

  function tagColor(n) {
    return ['#2d1b4e','#4fa8c9','#daa520','#c9a0dc','#b22222'][n-1] || '#5d4e6d';
  }
  function themePreview(i) {
    const map = ['#a8d8ea','#6b5878','#b22222','#ff6b35','#c9a0dc','#2c2c2c','#daa520','#718096','#7a6b8a'];
    return map[i];
  }

  // ========= TOAST =========
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ========= 数据导出/导入/清空 =========
  function exportData() {
    const backup = {
      _app: 'daily-journal',
      _version: 1,
      _exportDate: new Date().toISOString(),
      records: loadRecords(),
      weekGoals: loadWeekGoals(),
      monthGoals: loadMonthGoals(),
      yearGoals: loadYearGoals(),
      compactMode: (() => { try { return localStorage.getItem('daily_journal_compact_mode') === '1'; } catch(e) { return false; } })()
    };
    const json = JSON.stringify(backup, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    a.href = url;
    a.download = `journal_backup_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('📦 备份文件已下载');
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const backup = JSON.parse(e.target.result);
        if (!backup || backup._app !== 'daily-journal') {
          toast('❌ 文件格式不正确');
          return;
        }
        const records = backup.records || {};
        const existing = loadRecords();
        let added = 0, overwritten = 0;
        // 合并：已有的保留，新数据覆盖同日期
        for (const d in records) {
          if (existing[d]) overwritten++;
          else added++;
          existing[d] = records[d];
        }
        saveRecords(existing);
        // 目标数据直接覆盖
        if (backup.weekGoals) saveWeekGoals(backup.weekGoals);
        if (backup.monthGoals) saveMonthGoals(backup.monthGoals);
        if (backup.yearGoals) saveYearGoals(backup.yearGoals);
        if (backup.compactMode) {
          try { localStorage.setItem('daily_journal_compact_mode', '1'); } catch(err) {}
        }
        renderList();
        toast(`✅ 导入完成：新增 ${added} 天，覆盖 ${overwritten} 天`);
      } catch(err) {
        toast('❌ 文件解析失败：' + err.message);
      }
    };
    reader.readAsText(file);
  }

  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', () => {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) importData(file);
    e.target.value = '';
  });
  document.getElementById('clearAllBtn').addEventListener('click', () => {
    if (!confirm('⚠️ 确认清空所有数据？\n\n这将删除：\n· 全部日记记录\n· 全部周/月/年目标\n· 紧凑模式偏好\n\n建议先点「导出数据备份」再清空！')) return;
    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(WEEK_GOALS_KEY);
      localStorage.removeItem(MONTH_GOALS_KEY);
      localStorage.removeItem(YEAR_GOALS_KEY);
      localStorage.removeItem('daily_journal_compact_mode');
    } catch(e) {}
    renderList();
    toast('🗑 所有数据已清空');
  });

  // ========= INIT =========
  (function init() {
    // 初始化 summary 日期
    const today = new Date();
    const y = today.getFullYear();
    const onejan = new Date(y, 0, 1);
    const weekNum = Math.ceil((((today - onejan) / 86400000) + onejan.getDay() + 1) / 7);
    document.getElementById('weekPicker').value = `${y}-W${String(weekNum).padStart(2,'0')}`;
    document.getElementById('monthPicker').value = `${y}-${String(today.getMonth()+1).padStart(2,'0')}`;
  })();
</script>

</body>
</html>
